# CI on every push to dev and main (KS-Suite specs/release-cycle.md): tests, lint, the
# language check, a build on macOS and Windows, and the app's self-test against the built
# app (tabs, splits, a real shell, themes, settings). Windows also installs the installer
# silently, self-tests the installed copy and uninstalls it; the unsigned installer is kept
# as an artifact for testing on a Windows machine.
# Runner images are named versions; actions are GitHub's own, pinned to a full commit SHA.
name: CI

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - name: Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            shared/src-tauri/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('shared/src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Install
        working-directory: shared
        run: npm ci
      - name: Interface (type check and build), tests, language files
        working-directory: shared
        run: |
          npm run build
          npm test
          npm run test:lang
      - name: Release scripts
        run: node --test scripts/test/
      - name: Rust tests
        working-directory: shared/src-tauri
        run: cargo test --quiet
      - name: Clippy
        working-directory: shared/src-tauri
        run: cargo clippy --all-targets --quiet -- -D warnings
      - name: Build the app (macOS)
        if: runner.os == 'macOS'
        working-directory: shared
        run: npm run tauri build -- --bundles app
      - name: Self-test of the built app (macOS)
        if: runner.os == 'macOS'
        run: |
          OUT=$(KS_FORGE_SELFTEST=1 timeout 180 "shared/src-tauri/target/release/bundle/macos/KS Forge.app/Contents/MacOS/ks-forge" 2>&1 || true)
          echo "$OUT" | grep KS_FORGE_SELFTEST || true
          echo "$OUT" | grep -q "KS_FORGE_SELFTEST PASS" || { echo "::error::self-test failed"; echo "$OUT" | tail -30; exit 1; }
      - name: Build the installer (Windows)
        if: runner.os == 'Windows'
        working-directory: shared
        run: npm run tauri build -- --bundles nsis
      - name: Install, self-test, uninstall (Windows)
        if: runner.os == 'Windows'
        run: |
          set -- shared/src-tauri/target/release/bundle/nsis/*-setup.exe
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::expected one installer, found: $*"; exit 1; }
          mkdir -p out && cp "$1" out/ks-forge-dev-windows-x64-setup.exe
          sh desktop/windows/test-installer.sh out/ks-forge-dev-windows-x64-setup.exe
      - name: Keep the unsigned installer (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-unsigned
          path: out/ks-forge-dev-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

# Moves KS Forge to ks-utility's newest tag the day it is released (ks-utility
# specs/release-workflow.md, "Moving to the newest ks-utility"): checks out dev, moves the git
# tag in shared/package.json and shared/src-tauri/Cargo.toml and both lock files, runs the
# tests, and only when they pass commits "chore: move ks-utility to vX.Y.Z" to dev.
# When the tests fail nothing is pushed and an issue is opened.
name: Move to the newest ks-utility

on:
  repository_dispatch:
    types: [ks-utility-released]
  schedule:
    - cron: "17 4 * * *"   # daily, in case a notice was missed
  workflow_dispatch:

permissions: {}

jobs:
  bump:
    permissions:
      contents: write
      issues: write
    uses: kumasumit/ks-utility/.github/workflows/ks-utility-bump.yml@v0.17.0
    with:
      kind: tauri
      # macOS: the PTY tests need a Unix PTY, and Cargo builds the macOS-only code.
      runs-on: macos-15
      node-version: "26"
      test: cd shared && npm ci && npm test && npm run test:lang && cd src-tauri && cargo test --quiet
    # Lets the move also rewrite these @vX calls of ks-utility's workflows (GitHub's own token
    # may not change workflow files). Without it, ks-suite-check stops the release until they
    # are moved by hand.
    secrets:
      KS_WORKFLOWS_TOKEN: ${{ secrets.KS_WORKFLOWS_TOKEN }}

# Release (KS-Suite specs/release-cycle.md; this repository's specs/release.md). Two ways in:
#
#   Tag push on main           vX.Y.Z builds both systems and is marked latest; mac-vX.Y.Z or
#                              windows-vX.Y.Z builds only that system and is not marked latest.
#   Manual run (rehearsal)     Any branch, with the version and platform to rehearse; builds
#                              and checks everything, attests and publishes nothing.
#
# The tag check and the attest-and-publish step are ks-utility's shared Tauri workflows
# (ks-utility specs/release-workflow.md, "Tauri apps"); the check also runs ks-suite-check, the
# suite rules code can check. The macOS and Windows builds are ours.
# Runner images are named versions; actions are GitHub's own, pinned to a full commit SHA.
name: Release

on:
  push:
    tags: ["v*", "mac-v*", "windows-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, X.Y.Z (CHANGELOG.md needs a dated section for it). Builds, releases nothing."
        required: true
        type: string
      platform:
        description: "What to rehearse: both systems (a plain tag), or one (mac-v / windows-v)."
        required: true
        default: all
        type: choice
        options: [all, mac, windows]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag is vX.Y.Z, mac-vX.Y.Z or windows-vX.Y.Z, higher than the tags before it, on main,
  # with a dated CHANGELOG section; outputs tag, version, platform, heading, rehearsal.
  version:
    permissions:
      contents: read
    uses: kumasumit/ks-utility/.github/workflows/tauri-app-release-check.yml@v0.17.0
    with:
      version: ${{ inputs.version }}
      platform: ${{ inputs.platform }}
      platforms: "mac windows"
      set-version: node scripts/set-version.mjs "$KS_TAG"

  mac:
    needs: version
    if: needs.version.outputs.platform != 'windows'
    runs-on: macos-15
    permissions:
      contents: read
    env:
      KSF_TAG: ${{ needs.version.outputs.tag }}
      KSF_APP: shared/src-tauri/target/release/bundle/macos/KS Forge.app
      KSF_DMG: ks-forge-v${{ needs.version.outputs.version }}-macos-arm64.dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - name: Install
        working-directory: shared
        run: npm ci
      # Before the version is written: the release-script tests copy the unversioned files.
      - name: Tests
        run: |
          (cd shared && npm test && npm run test:lang)
          node --test scripts/test/
          (cd shared/src-tauri && cargo test --quiet)
      - run: node scripts/set-version.mjs "$KSF_TAG"
      # Ad hoc signature (no Apple Developer ID yet: specs/plan.md, 8).
      - name: Build the app
        working-directory: shared
        run: npm run tauri build -- --bundles app
      - name: The app has the version and runs (self-test)
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          got=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$KSF_APP/Contents/Info.plist")
          [ "$got" = "$V" ] || { echo "::error::app version $got, expected $V"; exit 1; }
          codesign --verify --deep --strict "$KSF_APP"
          node scripts/selftest.mjs "$KSF_APP/Contents/MacOS/ks-forge"
      - name: Make the disk image
        run: |
          mkdir -p release
          sh desktop/mac/make-dmg.sh "$KSF_APP" "release/$KSF_DMG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: release/
          if-no-files-found: error

  windows:
    needs: version
    if: needs.version.outputs.platform != 'mac'
    runs-on: windows-2025
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      KSF_TAG: ${{ needs.version.outputs.tag }}
      KSF_SETUP: ks-forge-v${{ needs.version.outputs.version }}-windows-x64-setup.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: shared/package-lock.json
      - name: Install
        working-directory: shared
        run: npm ci
      # Before the version is written: the release-script tests copy the unversioned files.
      - name: Tests
        run: |
          (cd shared && npm test && npm run test:lang)
          (cd shared/src-tauri && cargo test --quiet)
      - run: node scripts/set-version.mjs "$KSF_TAG"
      # Not Authenticode-signed yet (specs/plan.md, 8).
      - name: Build the installer
        working-directory: shared
        run: npm run tauri build -- --bundles nsis
      - name: Name it
        run: |
          mkdir -p release
          set -- shared/src-tauri/target/release/bundle/nsis/*-setup.exe
          [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::expected one installer, found: $*"; exit 1; }
          cp "$1" "release/$KSF_SETUP"
      - name: Install, self-test, uninstall
        run: sh desktop/windows/test-installer.sh "release/$KSF_SETUP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: release/
          if-no-files-found: error

  # Attests every file (not in a rehearsal), checks they arrived unchanged and publishes:
  # a plain tag's release is marked latest, a platform tag's is not.
  publish:
    needs: [version, mac, windows]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: kumasumit/ks-utility/.github/workflows/tauri-app-release-publish.yml@v0.17.0
    with:
      tag: ${{ needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.version }}
      platform: ${{ needs.version.outputs.platform }}
      rehearsal: ${{ needs.version.outputs.rehearsal }}
      files: >-
        ${{ needs.version.outputs.platform != 'windows' && format('ks-forge-v{0}-macos-arm64.dmg', needs.version.outputs.version) || '' }}
        ${{ needs.version.outputs.platform != 'mac' && format('ks-forge-v{0}-windows-x64-setup.exe', needs.version.outputs.version) || '' }}
      title: KS Forge ${{ needs.version.outputs.heading }}
      notes: node scripts/release-notes.mjs "$KS_TAG" > notes.md

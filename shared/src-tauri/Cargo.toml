[package]
name = "ks-forge"
# Placeholder. Release builds take the version from the git tag (CLAUDE.md).
version = "0.0.0"
description = "KS Forge"
authors = ["Kumar Sumit"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (a Windows issue,
# see https://github.com/rust-lang/cargo/issues/8519).
name = "ks_forge_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: transparent windows for the background blur (plan-per-platform 2.1).
tauri = { version = "2", features = ["macos-private-api"] }
# First-party shared utilities (KS-Suite), pinned to one tag; see CLAUDE.md.
ks-utility = { git = "https://github.com/kumasumit/ks-utility", tag = "v0.18.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# PTY on macOS, ConPTY on Windows, behind one API (specs/dependencies.md).
portable-pty = "0.9"
# The system clipboard for the shortcuts that are not the system's own (specs/dependencies.md).
arboard = { version = "3", default-features = false }
# The app-update request and download: HTTP/1.1, rustls, no decompression (specs/dependencies.md).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros"] }
futures-util = { version = "0.3", default-features = false }
# "Command finished" notifications (plan-per-platform, decision 3).
tauri-plugin-notification = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows: the running-program check, jump list, administrator profiles and Narrator check
# (desktop/windows/src/platform.rs); a second launch opens a tab (plan-per-platform,
# decision 3). `windows` is already in the tree through Tauri.
[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }

# macOS: the Dock menu, Finder services and VoiceOver check (desktop/mac/src/platform.rs).
# Already in the tree through Tauri (specs/dependencies.md).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSPasteboard", "NSWorkspace", "NSResponder", "objc2-core-foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
